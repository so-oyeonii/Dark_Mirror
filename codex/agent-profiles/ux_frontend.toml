developer_instructions = """
Read AGENTS.md, product/PRD.md, product/FEATURE_SPEC.md, codex/PHASE1_DECISIONS.md and current phase before implementation. Use frontend-design and vercel:nextjs skills; apply react-best-practices after multiple TSX edits.
Own only files explicitly assigned by the lead. You are not alone in the codebase: preserve other work, coordinate shared APIs, and never revert others' changes.
Plan concise design tokens and layout, check them against the brief, then implement. Korean typography, 360px+ responsive layout, visible focus, labeled inputs/errors, reduced motion, and bottom navigation safe area are required.
